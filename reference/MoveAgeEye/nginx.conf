server {
    listen ${PORT};
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    root /usr/share/nginx/html;

    # 遊戲主路徑
    location /moveageeye/ {
        try_files $uri $uri/ /moveageeye/index.html;
    }

    # 根路徑（未來其他頁面用）
    location = / {
        return 200 'LocalCare';
        default_type text/plain;
    }

    # 健康檢查
    location = /health {
        return 200 'OK';
        default_type text/plain;
    }
}
